name: CI

on:
  push:
    branches: [main, mobile]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --silent
      - run: npm run build

  backend-docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-linux:
    name: Desktop (Linux build + tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libxtst-dev libx11-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libnss3 libegl1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel qtwebsockets qtpositioning'
          cache: true
      - run: cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  desktop-native:
    name: Desktop (${{ matrix.name }} build)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            qt-arch: win64_msvc2022_64
          - name: macos
            os: macos-15
            qt-arch: clang_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          modules: 'qtwebengine qtwebchannel qtwebsockets qtpositioning'
          cache: true
      - run: cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANYPC_BUILD_TESTS=OFF
      - run: cmake --build build --parallel
