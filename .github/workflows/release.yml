name: Release

# Pushing a tag such as v1.2.3 (or running the workflow manually with a
# version) builds and publishes, all on one GitHub Release for the tag:
#   - the backend Docker image to GitHub Container Registry (repository "Packages")
#   - Windows (.exe installer), macOS (.dmg) and Linux (.AppImage) desktop builds
#   - Android (.apk/.aab) and iOS (unsigned .ipa) mobile builds (mobile.yml)
#
# Robustness:
#   - The release is created first and every build attaches its own files as
#     soon as it finishes, so a slow or unavailable runner (e.g. macOS) only
#     delays its own file instead of blocking the whole release.
#   - All GitHub API calls go through .github/scripts/release.sh, which retries
#     transient GitHub errors (5xx) with backoff and is safe to re-run.
#   - Re-running failed jobs of a run (or running the workflow again with the
#     same version) updates the existing release instead of failing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3); the tag v<version> is created on the selected commit'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  QT_MODULES: 'qtwebengine qtwebchannel qtwebsockets qtpositioning qtserialport'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then RAW="${GITHUB_REF_NAME#v}"; else RAW="${INPUT_VERSION#v}"; fi
          RAW="$(echo "$RAW" | tr -d '[:space:]')"
          if ! [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          NUMERIC="${RAW%%-*}"
          PRERELEASE=false
          [[ "$RAW" == *-* ]] && PRERELEASE=true
          {
            echo "version=$RAW"
            echo "numeric=$NUMERIC"
            echo "tag=v$RAW"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Version $RAW (numeric $NUMERIC, tag v$RAW, prerelease $PRERELEASE)"

  release:
    name: Create GitHub Release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Create or update the release
        shell: bash
        run: |
          mkdir -p empty
          bash .github/scripts/release-notes.sh "$VERSION" "${{ github.repository_owner }}" empty pending > notes.md
          FLAGS=()
          [[ "${{ needs.version.outputs.prerelease }}" == true ]] && FLAGS+=(--prerelease)
          bash .github/scripts/release.sh ensure "$TAG" "$GITHUB_SHA" "AnyPC $VERSION" notes.md "${FLAGS[@]}"

  backend-image:
    name: Backend image
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --silent

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/any-pc-backend
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=anypc-backend
            org.opencontainers.image.description=AnyPC signaling server and Cloudflare Realtime SFU broker

      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [version, release]
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            qt-arch: win64_msvc2022_64
          - name: macos
            os: macos-15
            qt-arch: clang_64
          - name: linux
            os: ubuntu-22.04
            qt-arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NUMERIC_VERSION: ${{ needs.version.outputs.numeric }}
      TAG: ${{ needs.version.outputs.tag }}
      # Optional: only pre-fills the first-run server dialog.
      SERVER_URL: ${{ vars.ANYPC_SERVER_URL || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libxtst-dev libx11-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxkbfile1 libfuse2 libegl1

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure
        shell: bash
        run: |
          EXTRA=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then EXTRA+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0); fi
          cmake -S desktop -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANYPC_BUILD_TESTS=OFF \
            -DANYPC_VERSION="$NUMERIC_VERSION" \
            -DANYPC_DEFAULT_SERVER_URL="$SERVER_URL" \
            "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/packaging/windows/build-installer.ps1 -BuildDir build -Version $env:VERSION -OutputDir dist

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./desktop/packaging/macos/build-dmg.sh build "$VERSION" dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./desktop/packaging/linux/build-appimage.sh build "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: anypc-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/release.sh upload "$TAG" dist/*

  mobile:
    name: Mobile
    needs: [version, release]
    uses: ./.github/workflows/mobile.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      release_tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  finalize:
    name: Finalize release (notes and checksums)
    needs: [version, release, backend-image, desktop, mobile]
    # Runs even when some builds failed or were cancelled: the release keeps the
    # files that were built and the notes say which ones are missing.
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # The files attached to the release are the source of truth (a re-run
      # job may have replaced one), so checksums are computed from them.
      - name: Download the release files
        shell: bash
        run: |
          bash .github/scripts/release.sh download "$TAG" files
          rm -f files/SHA256SUMS.txt
          ls -l files

      - name: Checksums and final notes
        shell: bash
        run: |
          shopt -s nullglob
          assets=(files/*)
          if (( ${#assets[@]} > 0 )); then
            (cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
            bash .github/scripts/release.sh upload "$TAG" files/SHA256SUMS.txt
          else
            echo "::warning::No build attached a file to the release."
          fi
          bash .github/scripts/release-notes.sh "$VERSION" "${{ github.repository_owner }}" files final > notes.md
          # Append GitHub's generated changelog (best effort).
          PREVIOUS=$(gh release list --limit 20 --exclude-drafts --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | grep -vx "$TAG" | head -1 || true)
          ARGS=(-f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA")
          [[ -n "$PREVIOUS" ]] && ARGS+=(-f "previous_tag_name=$PREVIOUS")
          if CHANGES=$(gh api -X POST "repos/$GH_REPO/releases/generate-notes" "${ARGS[@]}" --jq .body 2>/dev/null); then
            printf '\n%s\n' "$CHANGES" >> notes.md
          fi
          cat notes.md
          bash .github/scripts/release.sh notes "$TAG" notes.md

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### AnyPC $VERSION"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Backend image | ${{ needs.backend-image.result }} |"
            echo "| Desktop builds | ${{ needs.desktop.result }} |"
            echo "| Mobile builds | ${{ needs.mobile.result }} |"
            echo
            echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
